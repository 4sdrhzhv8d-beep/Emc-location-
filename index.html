<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mots Fléchés Financiers - Mobile</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }
        .main-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            color: #1e3a8a;
            text-align: center;
            margin-bottom: 2px;
            font-weight: 700;
        }
        .subtitle {
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 15px;
        }
        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background-color: #fff;
            color: #1e293b;
        }
        
        /* Stats et Progression */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .progress-container {
            background-color: #e2e8f0;
            border-radius: 4px;
            height: 8px;
            width: 100%;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .progress-bar {
            background-color: #3b82f6;
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Définition */
        .definition-card {
            background-color: #f0f4ff;
            border-left: 4px solid #3b82f6;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
        .definition-title {
            font-weight: 700;
            color: #1e3a8a;
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .definition-text {
            color: #334155;
            font-size: 0.95rem;
            line-height: 1.4;
            margin: 0;
        }

        /* Boîtes de lettres interactives */
        .letter-inputs-container {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .letter-box {
            width: 38px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background-color: #fff;
            color: #1e3a8a;
            cursor: pointer;
            transition: all 0.2s;
        }
        .letter-box.active-box {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background-color: #f8fafc;
        }

        /* Clavier Virtuel Intégré */
        .virtual-keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 20px;
            background-color: #e2e8f0;
            padding: 10px;
            border-radius: 12px;
        }
        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .key-btn {
            background-color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            color: #1e293b;
            padding: 10px 0;
            flex: 1;
            max-width: 34px;
            height: 42px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            transition: background-color 0.1s;
        }
        .key-btn:active {
            background-color: #cbd5e1;
        }
        .key-btn.wide {
            max-width: 60px;
            font-size: 0.8rem;
            background-color: #cbd5e1;
        }

        /* Boutons d'action */
        .actions-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button.btn-primary {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        button.btn-primary:hover {
            background-color: #1e40af;
        }
        button.btn-secondary {
            background-color: #64748b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: 600;
            flex: 1;
        }
        button.btn-secondary:hover {
            background-color: #475569;
        }
        button.btn-hint {
            background-color: #f59e0b;
            margin-bottom: 12px;
            width: 100%;
        }
        button.btn-hint:hover {
            background-color: #d97706;
        }

        #message {
            margin-top: 12px;
            font-weight: 600;
            text-align: center;
            min-height: 22px;
            font-size: 0.95rem;
        }

        .hint-box {
            background-color: #fef3c7;
            border: 1px solid #fde68a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            color: #92400e;
            font-style: italic;
            font-size: 0.9rem;
            display: none;
        }

        .center-text {
            text-align: center;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <h1>Mots Fléchés</h1>
    <div class="subtitle">Spécial Trading & Finance (Mobile Friendly)</div>

    <div class="container">
        <!-- Écran de configuration -->
        <div id="setup-screen" class="screen active">
            <div class="form-group">
                <label for="difficulty">Choisissez le niveau de difficulté :</label>
                <select id="difficulty">
                    <option value="facile">Facile (Mots courts : 4 à 6 lettres)</option>
                    <option value="moyen" selected>Moyen (Mots de 7 à 9 lettres)</option>
                    <option value="difficile">Difficile (Mots longs : 10 lettres et plus)</option>
                </select>
            </div>
            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="startGame()">Commencer la partie</button>
        </div>

        <!-- Écran de jeu -->
        <div id="game-screen" class="screen">
            <div class="stats-bar">
                <span id="question-counter">Question 1 / 10</span>
                <span id="score-counter">Score : 0</span>
            </div>

            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div class="definition-card">
                <div id="def-title" class="definition-title">Définition 1</div>
                <p id="def-text" class="definition-text">Chargement...</p>
            </div>

            <button class="btn-primary btn-hint" onclick="showHint()" id="hint-btn">💡 Obtenir un indice</button>
            <div id="hint-display" class="hint-box"></div>

            <!-- Cases de lettres cliquables -->
            <div id="letter-inputs" class="letter-inputs-container"></div>

            <!-- Clavier Virtuel Intégré pour Smartphone -->
            <div class="virtual-keyboard">
                <div class="keyboard-row">
                    <button class="key-btn" onclick="typeLetter('A')">A</button>
                    <button class="key-btn" onclick="typeLetter('Z')">Z</button>
                    <button class="key-btn" onclick="typeLetter('E')">E</button>
                    <button class="key-btn" onclick="typeLetter('R')">R</button>
                    <button class="key-btn" onclick="typeLetter('T')">T</button>
                    <button class="key-btn" onclick="typeLetter('Y')">Y</button>
                    <button class="key-btn" onclick="typeLetter('U')">U</button>
                    <button class="key-btn" onclick="typeLetter('I')">I</button>
                    <button class="key-btn" onclick="typeLetter('O')">O</button>
                    <button class="key-btn" onclick="typeLetter('P')">P</button>
                </div>
                <div class="keyboard-row">
                    <button class="key-btn" onclick="typeLetter('Q')">Q</button>
                    <button class="key-btn" onclick="typeLetter('S')">S</button>
                    <button class="key-btn" onclick="typeLetter('D')">D</button>
                    <button class="key-btn" onclick="typeLetter('F')">F</button>
                    <button class="key-btn" onclick="typeLetter('G')">G</button>
                    <button class="key-btn" onclick="typeLetter('H')">H</button>
                    <button class="key-btn" onclick="typeLetter('J')">J</button>
                    <button class="key-btn" onclick="typeLetter('K')">K</button>
                    <button class="key-btn" onclick="typeLetter('L')">L</button>
                    <button class="key-btn" onclick="typeLetter('M')">M</button>
                </div>
                <div class="keyboard-row">
                    <button class="key-btn wide" onclick="deleteLetter()">⌫</button>
                    <button class="key-btn" onclick="typeLetter('W')">W</button>
                    <button class="key-btn" onclick="typeLetter('X')">X</button>
                    <button class="key-btn" onclick="typeLetter('C')">C</button>
                    <button class="key-btn" onclick="typeLetter('V')">V</button>
                    <button class="key-btn" onclick="typeLetter('B')">B</button>
                    <button class="key-btn" onclick="typeLetter('N')">N</button>
                    <button class="key-btn wide" onclick="submitAnswer()">↵</button>
                </div>
            </div>

            <div class="actions-container">
                <button class="btn-primary" onclick="submitAnswer()">Valider</button>
                <button class="btn-secondary" onclick="skipQuestion()">Passer</button>
            </div>

            <div id="message"></div>
        </div>

        <!-- Écran de fin -->
        <div id="end-screen" class="screen center-text">
            <h2>Partie Terminée !</h2>
            <p id="final-score" style="font-size: 1.2rem; margin: 20px 0; color: #334155;"></p>
            <button class="btn-primary" onclick="resetGame()">Rejouer une partie</button>
        </div>
    </div>
</div>

<script>
    // Mots encodés en base64 inversé (Sécurisé)
    const encodedFinancialData = [
        { w: "gnidart", def: "Activité d'achat et de vente d'instruments financiers à court terme sur les marchés." },
        { w: "ehcram", def: "Lieu physique ou virtuel où se rencontrent l'offre et la demande d'actifs financiers." },
        { w: "ruelav", def: "Prix ou estimation de la valeur d'un titre financier sur le marché." },
        { w: "sruoc", def: "Prix coté d'un actif financier à un moment donné." },
        { w: "ecnadnet", def: "Orientation générale prise par les prix d'un marché sur une période donnée (haussière ou baissière)." },
        { w: "esylana", def: "Examen approfondi des données de marché, qu'elles soient techniques ou fondamentales." },
        { w: "eigetarts", def: "Plan d'action global défini par le trader pour gérer ses positions et limiter ses risques." },
        { w: "noitca", def: "Partie du capital social d'une entreprise émise sur les marchés financiers." },
        { w: "esurob", def: "Institution centralisée où s'échangent les valeurs mobilières." },
        { w: "noitpo", def: "Contrat donnant le droit, mais non l'obligation, d'acheter ou de vendre un actif à un prix fixé." },
        { w: "euqsir", def: "Mesure de l'incertitude quant à la perte potentielle sur un investissement." },
        { w: "tnangag", def: "Qualifie un trade ou un investissement clôturé avec une plus-value positive." },
        { w: "tnadrep", def: "Qualifie une position de marché soldée avec une perte financière." },
        { w: "igolohcysep", def: "Facteur mental et émotionnel primordial dans la maîtrise du comportement du trader." },
        { w: "euqihparg", def: "Représentation visuelle de l'évolution historique des cours boursiers." },
        { w: "troppus", def: "Niveau de prix où la pression acheteuse est censée freiner la baisse." },
        { w: "ecnatsiser", def: "Niveau de prix où les vendeurs ont tendance à stopper la hausse." },
        { w: "noitalucpes", def: "Opération consistant à parier sur l'évolution future des cours pour réaliser un profit." },
        { w: "egartibra", def: "Exploitation d'écarts de prix constatés simultanément sur différents marchés." },
        { w: "etidiuqil", def: "Facilité avec laquelle un actif peut être acheté ou vendu rapidement sans impacter son prix." },
        { w: "etnedivid", def: "Part des bénéfices d'une entreprise versée aux actionnaires." },
        { w: "noitalfni", def: "Perte de la valeur d'achat de la monnaie se traduisant par une hausse générale des prix." },
        { w: "ecneicffe", def: "Caractéristique d'un marché où les prix intègrent instantanément toute l'information disponible." },
        { w: "redart", def: "Professionnel ou particulier qui opère activement sur les marchés financiers." },
        { w: "rekorb", def: "Intermédiaire financier ou courtier exécutant les ordres de Bourse." },
        { w: "latipac", def: "Somme d'argent de départ allouée aux investissements ou au trading." },
        { w: "tnemedner", def: "Gain ou perte en pourcentage rapporté au montant investi." },
        { w: "etilitalov", def: "Mesure de l'ampleur des variations du cours d'un actif sur une période." },
        { w: "hkark", def: "Effondrement brutal et soudain des cours boursiers sur une courte période." },
        { w: "eirohpue", def: "Sentiment d'optimisme excessif des marchés précédant souvent un retournement." }
    ];

    function decodeWord(encodedStr) {
        return encodedStr.split('').reverse().join('');
    }

    const financialData = encodedFinancialData.map(item => ({
        word: decodeWord(item.w),
        def: item.def
    }));

    let currentDifficulty = "moyen";
    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let currentItem = null;
    let hintUsed = false;
    let activeBoxIndex = 0;

    function startGame() {
        currentDifficulty = document.getElementById("difficulty").value;
        
        let filtered = financialData.filter(item => {
            const len = item.word.length;
            if (currentDifficulty === "facile") return len >= 4 && len <= 6;
            if (currentDifficulty === "moyen") return len >= 7 && len <= 9;
            if (currentDifficulty === "difficile") return len >= 10;
            return true;
        });

        let pool = filtered.length >= 10 ? filtered : financialData;
        currentQuestions = [...pool].sort(() => 0.5 - Math.random()).slice(0, 10);

        while (currentQuestions.length < 10 && pool.length > 0) {
            const randomItem = pool[Math.floor(Math.random() * pool.length)];
            currentQuestions.push(randomItem);
        }

        currentIndex = 0;
        score = 0;

        document.getElementById("setup-screen").classList.remove("active");
        document.getElementById("game-screen").classList.add("active");

        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= 10) {
            endGame();
            return;
        }

        hintUsed = false;
        activeBoxIndex = 0;
        document.getElementById("hint-display").style.display = "none";
        document.getElementById("hint-display").innerText = "";
        document.getElementById("hint-btn").disabled = false;
        document.getElementById("message").innerText = "";

        currentItem = currentQuestions[currentIndex];
        
        document.getElementById("question-counter").innerText = `Question ${currentIndex + 1} / 10`;
        document.getElementById("score-counter").innerText = `Score : ${score}`;
        document.getElementById("def-title").innerText = `Définition ${currentIndex + 1}`;
        document.getElementById("def-text").innerText = currentItem.def;

        const progressPercent = (currentIndex / 10) * 100;
        document.getElementById("progress-bar").style.width = progressPercent + "%";

        renderLetterBoxes();
    }

    function renderLetterBoxes() {
        const container = document.getElementById("letter-inputs");
        container.innerHTML = "";

        const wordLength = currentItem.word.length;
        for (let i = 0; i < wordLength; i++) {
            const box = document.createElement("div");
            box.className = "letter-box" + (i === activeBoxIndex ? " active-box" : "");
            box.dataset.index = i;
            box.innerText = "";
            
            // Permettre de cliquer sur une case pour la sélectionner directement
            box.addEventListener("click", () => {
                activeBoxIndex = i;
                updateActiveBoxStyles();
            });

            container.appendChild(box);
        }
    }

    function updateActiveBoxStyles() {
        const boxes = document.querySelectorAll(".letter-box");
        boxes.forEach((box, idx) => {
            if (idx === activeBoxIndex) {
                box.classList.add("active-box");
            } else {
                box.classList.remove("active-box");
            }
        });
    }

    function typeLetter(letter) {
        const boxes = document.querySelectorAll(".letter-box");
        if (activeBoxIndex < boxes.length) {
            boxes[activeBoxIndex].innerText = letter;
            if (activeBoxIndex < boxes.length - 1) {
                activeBoxIndex++;
                updateActiveBoxStyles();
            }
        }
    }

    function deleteLetter() {
        const boxes = document.querySelectorAll(".letter-box");
        if (boxes[activeBoxIndex].innerText !== "") {
            boxes[activeBoxIndex].innerText = "";
        } else if (activeBoxIndex > 0) {
            activeBoxIndex--;
            boxes[activeBoxIndex].innerText = "";
            updateActiveBoxStyles();
        }
    }

    function showHint() {
        if (hintUsed) return;
        hintUsed = true;
        document.getElementById("hint-btn").disabled = true;

        const word = currentItem.word;
        const hintText = `Indice : Le mot comporte ${word.length} lettres. Il commence par '${word[0].toUpperCase()}' et se termine par '${word[word.length - 1].toUpperCase()}'.`;
        
        const hintBox = document.getElementById("hint-display");
        hintBox.innerText = hintText;
        hintBox.style.display = "block";
    }

    function submitAnswer() {
        const boxes = document.querySelectorAll(".letter-box");
        let userWord = "";
        boxes.forEach(box => {
            userWord += box.innerText.trim().toLowerCase();
        });

        const msg = document.getElementById("message");

        if (userWord.length < currentItem.word.length) {
            msg.style.color = "#d97706";
            msg.innerText = "Veuillez remplir toutes les cases.";
            return;
        }

        if (userWord === currentItem.word) {
            msg.style.color = "#16a34a";
            msg.innerText = "Correct ! 🎉 Excellente réponse.";
            score++;
            currentIndex++;
            setTimeout(loadQuestion, 1200);
        } else {
            msg.style.color = "#dc2626";
            msg.innerText = "Incorrect. Essayez encore !";
        }
    }

    function skipQuestion() {
        const msg = document.getElementById("message");
        msg.style.color = "#475569";
        msg.innerText = `La réponse était : ${currentItem.word.toUpperCase()}`;
        currentIndex++;
        setTimeout(loadQuestion, 1800);
    }

    function endGame() {
        document.getElementById("game-screen").classList.remove("active");
        document.getElementById("end-screen").classList.add("active");
        document.getElementById("final-score").innerText = `Votre score final est de ${score} / 10`;
        document.getElementById("progress-bar").style.width = "100%";
    }

    function resetGame() {
        document.getElementById("end-screen").classList.remove("active");
        document.getElementById("setup-screen").classList.add("active");
    }
</script>

</body>
</html>
